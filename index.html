<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote For Staines Runner</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #87ceeb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #gameContainer {
      text-align: center;
    }

    canvas {
      background: white;
      border: 3px solid black;
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-top: 10px;
    }

    #restartBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      display: none;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    #restartBtn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <h1>Vote For Staines</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <p>Press Space or Tap to Jump</p>
    <button id="restartBtn">Restart Game</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
